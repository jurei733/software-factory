name: Factory CI

on:
  pull_request:
  push:
  merge_group:

  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 2'

permissions:
  contents: read

concurrency:
  group: factory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Factory verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check Python syntax
        run: python3 scripts/check_syntax.py
      - name: Run factory regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify repository-independent configuration
        run: python3 scripts/check_portability.py
      - name: Install pinned workflow validator
        run: bash scripts/install_actionlint.sh
      - name: Validate central and exported workflows
        run: python3 scripts/check_workflows.py
      - name: Build portable factory package
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/software-factory.zip
          retention-days: 14
          if-no-files-found: error

  deliver:
    name: Signed delivery and staging
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Require other default-branch workflows at this exact source
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/require_workflows.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/payload
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
      - name: Bundle exact checked payload and security evidence
        env:
          FACTORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python3 scripts/publish_delivery.py --source "$RUNNER_TEMP/payload" --component factory
          --source-repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
          --security-evidence "$RUNNER_TEMP/evidence" --bundle-only "$RUNNER_TEMP/release/factory.zip"
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/release/factory.zip
      - name: Preserve public provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/release/provenance.sigstore.json"
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/release/factory.zip
          sbom-path: ${{ runner.temp }}/evidence/sbom.cdx.json
      - name: Verify real provenance and stage the signed distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/stage_release.py --archive "$RUNNER_TEMP/release/factory.zip"
          --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
          --default-branch "${{ github.event.repository.default_branch }}"
          --attestation-bundle "$RUNNER_TEMP/release/provenance.sigstore.json"
          --root "$RUNNER_TEMP/staging" --out "$RUNNER_TEMP/release/staging.json"
      - name: Preserve signed candidate as an unpublished release
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python3 scripts/publish_delivery.py --publish-bundle "$RUNNER_TEMP/release/factory.zip"
          --attestation-bundle "$RUNNER_TEMP/release/provenance.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: signed-factory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          retention-days: 30
          if-no-files-found: error

  security:
    name: Factory security
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install checksum-locked static-analysis dependencies
        run: >-
          python3 -m pip install --require-hashes --only-binary=:all: -r config/security/requirements.txt
      - name: Analyze executable factory code
        run: bandit -r factory.py repository_factory.py integration_updates.py tares_adapter.py connector_publisher.py pilot_checks.py runtime_safety.py isolated_runner.py scripts --severity-level medium --confidence-level medium
      - name: Install checksum-locked security scanner
        run: python3 scripts/install_scanner.py --directory "$RUNNER_TEMP/factory-scanner"
      - name: Scan factory dependencies and secrets
        run: >-
          trivy fs --config config/trivy.yaml --ignorefile /dev/null --scanners vuln,secret
          --severity HIGH,CRITICAL --format json --output "$RUNNER_TEMP/scan.json" .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - run: python3 repository_factory.py npm-audit --repo . --report "$RUNNER_TEMP/security/npm-audit.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/payload
      - name: Require clean security and create a bound SBOM
        run: |
          python3 -c 'import json,os; json.dump({"SchemaVersion":2,"ArtifactName":"empty","Results":[]},open(os.environ["RUNNER_TEMP"]+"/baseline.json","w"))'
          python3 scripts/security_gate.py --current "$RUNNER_TEMP/scan.json" --baseline "$RUNNER_TEMP/baseline.json" --out "$RUNNER_TEMP/security/gate.json"
          trivy fs --config config/trivy.yaml --ignorefile /dev/null --format cyclonedx --output "$RUNNER_TEMP/security/sbom.cdx.json" .
          python3 scripts/release_evidence.py --summary "$RUNNER_TEMP/security/gate.json" --sbom "$RUNNER_TEMP/security/sbom.cdx.json" --payload "$RUNNER_TEMP/payload" --out "$RUNNER_TEMP/security/security-summary.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: factory-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security/
          retention-days: 30
          if-no-files-found: error

  isolation:
    name: Isolated execution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Pull the immutable sandbox test image
        run: |
          image=$(python3 -c 'import json; print(json.load(open("config/sandbox.json"))["test_image"])')
          docker pull "$image"
      - name: Prove enforced paths, credential isolation, budgets and cleanup in real containers
        env:
          FACTORY_DOCKER_TESTS: '1'
        run: |
          python3 -m unittest discover -s tests -p test_isolation.py -v
          python3 -m unittest discover -s tests -p test_pilot_isolation.py -v

  compatibility:
    name: Integration (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [npm, pnpm, yarn-classic, yarn-modern, python, monorepo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Exercise real install, exported checks, upgrades and negative gates
        env:
          CASE: ${{ matrix.case }}
        run: python3 scripts/compatibility_matrix.py --case "$CASE" --out "$RUNNER_TEMP/compatibility/result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compatibility/
          retention-days: 14
          if-no-files-found: error

  recovery:
    name: Recovery drill
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/payload
      - name: Prove health, corruption rejection, rollback and synthetic state recovery
        run: python3 scripts/recovery_drill.py --package "$RUNNER_TEMP/payload/software-factory.zip" --out "$RUNNER_TEMP/recovery/result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery/
          retention-days: 30
          if-no-files-found: error

  agent-boundary:
    name: Native sandbox contract
    # Standard public macOS runner; no weakening of Ubuntu kernel restrictions.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Install integrity-locked CLI without model calls or login
        run: |
          npm ci --prefix config/ci-agent --ignore-scripts --no-audit --no-fund
          native="$GITHUB_WORKSPACE/config/ci-agent/node_modules/@openai/codex-darwin-arm64/vendor/aarch64-apple-darwin/bin"
          test -x "$native/codex"
          echo "$native" >> "$GITHUB_PATH"
      - name: Prove actual worker/reviewer filesystem and network denial
        env:
          FACTORY_CODEX_TESTS: '1'
        run: python3 -m unittest discover -s tests -p test_codex_boundaries.py -v

  gate:
    name: Factory readiness gate
    if: always()
    needs: [verify, security, isolation, compatibility, recovery, agent-boundary]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every readiness check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os; assert all(job["result"]=="success" for job in json.loads(os.environ["RESULTS"]).values())'
