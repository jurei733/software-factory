name: Factory delivery metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * 1'

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect actual CI and review metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/collect_factory_metrics.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-metrics-${{ github.run_id }}
          path: metrics/
          retention-days: 30
          if-no-files-found: error
