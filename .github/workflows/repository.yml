name: Repository factory

on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-factory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      stack: ${{ steps.profile.outputs.stack }}
      node: ${{ steps.profile.outputs.node }}
      python: ${{ steps.profile.outputs.python }}
      timeout_minutes: ${{ steps.profile.outputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require reviewed repository profile
        id: profile
        run: python3 ./repository_factory.py plan --repo . --config profiles/factory.json

  checks:
    name: Repository checks
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout_minutes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.plan.outputs.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.plan.outputs.stack == 'node'
        with:
          node-version: ${{ needs.plan.outputs.node }}
      - name: Install and run reviewed commands in sequence
        run: >-
          python3 ./repository_factory.py check --repo . --config profiles/factory.json
          --report-dir "$RUNNER_TEMP/factory-results"
      - name: Preserve bounded CI results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/factory-results/
          if-no-files-found: error
          retention-days: 14

  security:
    name: Repository security
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install checksum-verified scanner
        run: python3 ./scripts/install_scanner.py --directory "$RUNNER_TEMP/factory-scanner"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Complement scanner with npm advisories for all tracked npm lockfiles
        run: >-
          python3 ./repository_factory.py npm-audit --repo .
          --report "$RUNNER_TEMP/factory-security/npm-audit.json"
      - name: Scan without executing project code or using project ignore files
        run: >-
          trivy fs --config ./config/trivy.yaml --ignorefile /dev/null
          --scanners vuln,secret --severity HIGH,CRITICAL --format json
          --output "$RUNNER_TEMP/repository-scan.json" .
      - name: Block all HIGH or CRITICAL dependencies and secret findings
        run: |
          python3 -c 'import json,os; json.dump({"SchemaVersion":2,"ArtifactName":"empty","Results":[]},open(os.environ["RUNNER_TEMP"]+"/empty-baseline.json","w"))'
          python3 ./scripts/security_gate.py --current "$RUNNER_TEMP/repository-scan.json" --baseline "$RUNNER_TEMP/empty-baseline.json" --out "$RUNNER_TEMP/factory-security/security.json"
      - name: Create software bill of materials
        run: >-
          trivy fs --config ./config/trivy.yaml --ignorefile /dev/null
          --format cyclonedx --output "$RUNNER_TEMP/factory-security/sbom.cdx.json" .
      - name: Preserve sanitized security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/factory-security/
          if-no-files-found: error
          retention-days: 30

  gate:
    name: Repository factory gate
    if: always() && (github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: [plan, checks, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every configured check and security job
        env:
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.checks.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          test "$PLAN" = success
          test "$CHECKS" = success
          test "$SECURITY" = success
