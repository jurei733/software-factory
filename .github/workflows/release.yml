name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Signed ci-RUN-ATTEMPT-factory draft from current main
        type: string
        required: true
      confirm_version:
        description: Exact version from the signed candidate, for example 0.1.0
        type: string
        required: true
      publish:
        description: Explicitly publish the verified candidate
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: factory-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Verify and promote selected release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Require other source workflows
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/require_workflows.py
      - name: Verify current source, provenance, security, version and staging before optional publication
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE: ${{ inputs.candidate }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          if [ "$PUBLISH" = true ]; then args+=(--publish); fi
          python3 scripts/promote_release.py --candidate "$CANDIDATE" --confirm-version "$CONFIRM_VERSION" "${args[@]}" --out "$RUNNER_TEMP/release/result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          retention-days: 90
          if-no-files-found: error
